<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Guided SO-101 deterministic calibration for Chem-0 Lab Console." />
    <title>Chem-0 Calibration</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="calibration-app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark"></span>
          <h1>calibration</h1>
          <span class="brand-sub">so-101 · deterministic</span>
        </div>
        <div class="actions">
          <button id="prepare-calibration" class="ghost">Prepare</button>
          <button id="record-endpoint" class="ghost" disabled>Record</button>
          <button id="finish-calibration" class="primary" disabled>Finish</button>
        </div>
      </header>

      <section class="calibration-layout">
        <section class="panel calibration-visual">
          <div class="panel-head">
            <h2>Robot preview</h2>
            <span class="panel-hint">live + guide pose</span>
          </div>
          <div class="robot-diagram" aria-label="SO-101 calibration diagram">
            <div id="urdf-viewer" class="urdf-viewer"></div>
          </div>
          <div id="urdf-caption" class="urdf-caption">Loading URDF...</div>
        </section>

        <section class="panel calibration-controls">
          <div class="calibration-fields">
            <div class="field">
              <label for="calibration-robot">Connected robot</label>
              <select id="calibration-robot"></select>
            </div>
            <div class="field">
              <label for="calibration-robot-id">Robot id</label>
              <input id="calibration-robot-id" value="mcp_so101_b" />
            </div>
          </div>
          <div class="field calibration-secondary-actions">
            <label for="calibration-port">Serial port</label>
            <div class="field-row">
              <input id="calibration-port" value="/dev/tty.usbmodem5A460833421" aria-label="Selected serial port" />
              <button id="refresh-robots" class="ghost">Refresh</button>
            </div>
          </div>

          <div class="step-card">
            <div id="step-count" class="step-count">Not prepared</div>
            <h2 id="step-title">Prepare the arm</h2>
            <p id="step-prompt">Connect one powered arm, then click Prepare.</p>
          </div>

          <div id="endpoint-table" class="endpoint-table"></div>
          <pre id="calibration-output"></pre>
        </section>
      </section>
    </main>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js"
        }
      }
    </script>
    <script type="module" src="./calibration3d.mjs"></script>
  </body>
</html>

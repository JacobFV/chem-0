<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Guided SO-101 deterministic calibration for Chem-0 Lab Console." />
    <title>Chem-0 Calibration</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="calibration-app calibration-immersive">
      <div id="urdf-viewer" class="urdf-viewer-fullscreen"></div>

      <section id="start-overlay" class="overlay-center">
        <h1 class="overlay-title">Calibrate SO-101</h1>
        <button id="start-button" class="start-button">START CALIBRATION</button>
        <div class="start-picker">
          <label for="calibration-robot">Arm</label>
          <select id="calibration-robot"></select>
        </div>
        <div id="start-status" class="start-status">Scanning for arms…</div>
      </section>

      <section id="confirm-overlay" class="overlay-center" hidden>
        <h1 class="overlay-title">Overwrite calibration?</h1>
        <p class="overlay-body">
          This resets the homing offsets and position limits on the selected arm
          and writes a new calibration file. The existing calibration will be
          backed up next to the new one.
        </p>
        <div class="overlay-buttons">
          <button id="confirm-cancel" class="ghost-button">Cancel</button>
          <button id="confirm-start" class="start-button">Yes, recalibrate</button>
        </div>
      </section>

      <section id="step-overlay" class="overlay-bottom" hidden>
        <div id="progress-dots" class="progress-dots"></div>
        <div class="step-cue">
          <span id="cue-arrow" class="step-arrow" aria-hidden="true">·</span>
          <h2 id="cue-verb" class="step-verb pulse">Move the arm</h2>
        </div>
        <div id="step-status" class="step-status">step</div>
        <div id="step-error" class="step-error" hidden></div>
        <button id="step-button" class="step-button">RECORD</button>
      </section>

      <section id="done-overlay" class="overlay-center" hidden>
        <h1 class="overlay-title">✓ Calibration saved</h1>
        <div id="done-id" class="overlay-subtitle"></div>
        <button id="close-button" class="start-button">Close</button>
      </section>
    </main>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js"
        }
      }
    </script>
    <script type="module" src="./calibration3d.mjs"></script>
  </body>
</html>

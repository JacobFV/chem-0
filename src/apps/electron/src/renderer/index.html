<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Chem-0 Lab Console is a local LeRobot experiment console with shared backend tracking, camera tools, and agent sessions."
    />
    <title>Chem-0 Lab Console</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <h1>Chem-0 Lab Console</h1>
          <p>Local LeRobot experiment control with camera tools, session tracking, and artifact capture.</p>
        </div>
        <div class="actions">
          <button id="list-tools">Tools</button>
          <button id="pose-table">Pose Table</button>
        </div>
      </header>

      <section class="experiment-bar">
        <label>
          Experiment
          <select id="experiment"></select>
        </label>
        <label>
          New experiment
          <input id="experiment-name" value="Bench run" />
        </label>
        <button id="create-experiment">Create</button>
        <div id="active-experiment">No experiment</div>
      </section>

      <section class="grid">
        <section class="panel controls">
          <h2>Discovery</h2>
          <div class="button-row">
            <button id="list-ports">Serial Ports</button>
            <button id="list-cameras">Cameras</button>
            <button id="view-camera">View Camera 0</button>
          </div>

          <h2>Robot State</h2>
          <div class="button-row">
            <button id="get-arm-pose">Arm Pose</button>
            <button id="get-position">Position</button>
            <button id="open-gripper">Open Gripper</button>
            <button id="close-gripper">Close Gripper</button>
            <button id="ask-export">Ask Expert</button>
          </div>

          <h2>Tool Call</h2>
          <label>
            Tool
            <select id="tool"></select>
          </label>
          <label>
            Arguments
            <textarea id="args" spellcheck="false">{}</textarea>
          </label>
          <button id="call-tool">Call Tool</button>
        </section>

        <section class="panel camera">
          <h2>Camera</h2>
          <div class="camera-frame">
            <img id="camera-frame" alt="Camera frame" />
          </div>
        </section>

        <section class="panel chat">
          <h2>Agent Session</h2>
          <div id="chat-log" class="chat-log"></div>
          <div class="composer">
            <textarea id="chat-input" spellcheck="true" placeholder="Ask GPT-5.5 to inspect, reason, or call robot tools."></textarea>
            <div class="composer-actions">
              <button id="record-audio">Record</button>
              <button id="stop-audio" disabled>Stop</button>
              <button id="send-message">Send</button>
            </div>
          </div>
        </section>

        <section class="panel output-panel">
          <h2>Backend Output</h2>
          <pre id="output"></pre>
        </section>
      </section>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Episode replay on robot — Chem-0 Lab Console." />
    <title>Chem-0 Replay</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app" style="padding: 16px;">
      <header class="topbar" style="margin-bottom: 16px;">
        <div class="brand">
          <span class="brand-mark"></span>
          <h1>chem-0</h1>
          <span class="brand-sub">replay</span>
        </div>
      </header>

      <section class="panel" style="margin-bottom: 16px;">
        <div class="panel-head"><h2>Replay Episode</h2></div>
        <div class="panel-body" style="display: flex; flex-direction: column; gap: 10px; padding: 12px;">
          <div class="field">
            <label for="replay-dataset">Dataset repo ID</label>
            <input id="replay-dataset" placeholder="myuser/my-dataset" />
          </div>
          <div style="display: flex; gap: 12px;">
            <div class="field" style="flex: 1;">
              <label for="replay-episode">Episode</label>
              <input id="replay-episode" type="number" value="0" min="0" max="999" />
            </div>
            <div class="field" style="flex: 1;">
              <label for="replay-port">Robot port</label>
              <input id="replay-port" placeholder="/dev/cu.usbmodem..." />
            </div>
          </div>
          <div style="display: flex; gap: 8px; margin-top: 8px;">
            <button id="replay-start" class="primary">Replay</button>
          </div>
          <pre id="replay-status" style="font-size: 11px; color: var(--text-3); margin-top: 4px;">ready</pre>
          <pre id="replay-result" style="font-size: 11px; color: var(--text-2); background: var(--bg-0); padding: 12px; min-height: 60px; max-height: 200px; overflow-y: auto;"></pre>
        </div>
      </section>
    </main>
    <script>var exports = {};</script>
    <script src="./replay.js"></script>
  </body>
</html>

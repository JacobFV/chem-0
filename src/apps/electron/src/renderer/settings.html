<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Chem-0 Settings</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="settings-app">
      <header class="appbar">
        <div class="appbar-drag-left"></div>
        <div class="appbar-title">
          <span class="brand-mark"></span>
          <span class="appbar-title-text">Settings</span>
        </div>
        <div class="appbar-drag-right"></div>
      </header>
      <section class="settings-content">
        <section class="settings-section">
          <h2>Toolbar</h2>
          <label class="check">
            <input id="settings-show-tooltips" type="checkbox" />
            Show tooltips on toolbar hover
          </label>
          <p>Reveals each icon's label without delay when the pointer enters it.</p>
        </section>
        <section class="settings-section">
          <h2>Default robot</h2>
          <div class="field-row">
            <input id="settings-default-robot" placeholder="mcp_so101" />
            <button id="settings-save-robot" class="primary">Save</button>
          </div>
        </section>
        <section class="settings-section">
          <h2>About</h2>
          <p>chem-0 lab console &middot; local LeRobot experiment platform.</p>
        </section>
      </section>
    </main>
    <script>
      document.body.classList.add(`platform-${window.chem0?.platform ?? "darwin"}`);
      const robotInput = document.getElementById("settings-default-robot");
      const robotSave = document.getElementById("settings-save-robot");
      const tooltipsBox = document.getElementById("settings-show-tooltips");

      (async () => {
        try {
          const current = await window.chem0.callTool("get_default_robot", {});
          if (typeof current.robot_id === "string") robotInput.value = current.robot_id;
        } catch {}
        try {
          const settings = await window.chem0.getSettings();
          tooltipsBox.checked = settings.showToolbarTooltips !== false;
        } catch {}
      })();

      robotSave.addEventListener("click", async () => {
        const robot_id = robotInput.value.trim();
        if (!robot_id) return;
        await window.chem0.callTool("set_default_robot", { robot_id });
      });

      tooltipsBox.addEventListener("change", async () => {
        await window.chem0.setSetting("showToolbarTooltips", tooltipsBox.checked);
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Policy training for ACT imitation learning — Chem-0 Lab Console." />
    <title>Chem-0 Train</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark"></span>
          <h1>chem-0</h1>
          <span class="brand-sub">train</span>
        </div>
      </header>

      <section class="grid" style="grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px;">
        <section class="panel">
          <div class="panel-head"><h2>Start Training</h2></div>
          <div class="panel-body" style="display: flex; flex-direction: column; gap: 10px; padding: 12px;">
            <div class="field">
              <label for="train-dataset">Dataset repo ID</label>
              <input id="train-dataset" value="myuser/my-dataset" />
            </div>
            <div class="field">
              <label for="train-policy-type">Policy type</label>
              <select id="train-policy-type">
                <option value="act">ACT</option>
                <option value="diffusion">Diffusion</option>
                <option value="tdmpc">TDMPC</option>
              </select>
            </div>
            <div class="field">
              <label for="train-steps">Training steps</label>
              <input id="train-steps" type="number" value="50000" min="1000" max="500000" />
            </div>
            <div class="field">
              <label for="train-batch-size">Batch size</label>
              <input id="train-batch-size" type="number" value="8" min="1" max="256" />
            </div>
            <div class="field">
              <label for="train-output-dir">Output directory</label>
              <input id="train-output-dir" value="outputs/train" />
            </div>
            <div style="display: flex; gap: 8px; margin-top: 8px;">
              <button id="train-start" class="primary">Start Training</button>
              <button id="train-stop" class="ghost" disabled>Stop</button>
            </div>
            <pre id="train-status" style="font-size: 11px; color: var(--text-3); margin-top: 4px;">ready</pre>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head"><h2>Training Log</h2></div>
          <pre id="train-log" style="flex: 1; overflow-y: auto; font-size: 11px; padding: 12px; color: var(--text-2); background: var(--bg-0); margin: 0; min-height: 400px; max-height: 600px;"></pre>
        </section>
      </section>

      <section class="panel" style="margin: 0 16px 16px;">
        <div class="panel-head"><h2>Checkpoints</h2><button id="refresh-checkpoints" class="ghost">Refresh</button></div>
        <div id="checkpoint-list" style="padding: 12px; font-family: var(--font-mono); font-size: 11px; color: var(--text-3);"></div>
      </section>
    </main>
    <script>var exports = {};</script>
    <script src="./train.js"></script>
  </body>
</html>
